  <head>
    <meta charset="UTF-8" />

    <!--
      CA-1 privacy hardening (Captain America lane). Full directive-by-directive
      justifications live in docs/ultron/production-log.md (CA-1 entry);
      tests/e2e/privacy.spec.ts asserts this policy is SERVED and ENFORCED
      against the production build (vite preview), including a canary that
      proves inline scripts and off-origin connects are actually blocked.

      Deliberately NOT here, with reasons:
      - frame-ancestors — ignored inside a meta CSP (CSP3 §6.3); it needs the
        response-header form, handed to DEP-1's Cloudflare Pages config
        (together with X-Frame-Options: DENY as the legacy belt).
      - Permissions-Policy (camera/mic/geolocation = ()) — browsers do not
        support meta delivery for this header (response header only, MDN);
        also handed to DEP-1 with the exact recommended line in the log.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>HOLD/OS — The Survey Archive</title>
  </head>
  <body>
    <!--
      Direction contract — The Survey Archive (docs/ultron/design-brief.md, user-committed 2026-09-01).
      This comment must remain the first child of <body>; ultron-impeccable audits the build against it.

      THESIS: A portfolio you operate — a survey vessel's specimen-archive console where every project
      is a catalogued specimen and the archive literally remembers everything you do. Refuses: the
      dark-glass OS pastiche and the pure retro-terminal.

      OWN-WORLD: Warm near-black console chrome, amber phosphor only in recessed display wells,
      parchment catalog labels, brass hardware touchpoints, drawer-modules and specimen icons —
      recognizable with all content removed.

      STORY: Visitor boots the console, sees the science officer's collection, opens drawers, reads
      specimens, leaves via the nameplate manifest's real links — having FELT state persist under
      their own hands.

      FIRST VIEWPORT: POST types in amber (≤2s) → hold lights come up → desktop: pinned specimen
      icons on an archive-plate wallpaper, drawer-rail taskbar with live timecode, About specimen
      glowing gently as the invitation.

      FORM: User-pinned fusion of catalog worlds (Vitrine × cassette-futurism console); seed key
      4836c942, assigned index 7, pick card fused by user decision.

      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review,
      the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
